<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Afterglow</title>
    <meta
      name="description"
      content="Afterglow turns a moment into a memory worth keeping: photos, videos, songs, people and a timeline, shared with a single link."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Afterglow" />
    <meta property="og:title" content="Afterglow" />
    <meta
      property="og:description"
      content="Create a memory worth keeping."
    />
    <meta property="og:image" content="/afterglow-icon.png" />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#f8f5f1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/afterglow-icon.png" />

    <!-- Fonts: loaded here (not via CSS @import) so they don't block CSS parsing -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('afterglow-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Afterglow needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
